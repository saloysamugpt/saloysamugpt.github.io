<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070b" />
  <title>Instagram Bloqueado</title>

  <style>
    :root{
      --bg1:#07070b;
      --bg2:#0e0f18;
      --card:rgba(255,255,255,.07);
      --stroke:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.74);
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:
        radial-gradient(1000px 700px at 20% 10%, rgba(255, 0, 120, .11), transparent 55%),
        radial-gradient(900px 650px at 80% 20%, rgba(0, 180, 255, .11), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,Segoe UI,Roboto,Arial;
      color:var(--text);
    }

    body{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }

    .card{
      width:min(560px, 94vw);
      border-radius:22px;
      padding:28px 22px 24px;
      background:var(--card);
      border:1px solid var(--stroke);
      box-shadow:0 22px 80px rgba(0,0,0,.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align:center;
    }

    .icon{
      width:66px; height:66px;
      margin:2px auto 14px;
      border-radius:18px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 12px 40px rgba(0,0,0,.35);
      font-size:30px;
    }

    h1{
      margin:0 0 12px;
      font-size:26px;
      font-weight:650;
      letter-spacing:.2px;
    }

    .phrase{
      margin:0 auto 18px;
      color:var(--muted);
      font-size:16px;
      line-height:1.35;
      padding:12px 14px;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      max-width:520px;
    }

    .counter{
      font-variant-numeric: tabular-nums;
      font-size:44px;
      font-weight:750;
      letter-spacing:2px;
      line-height:1;
      text-shadow:0 18px 60px rgba(0,0,0,.45);
      transition: color .25s ease, transform .15s ease;
    }
  </style>
</head>

<body>
  <div class="card" role="group" aria-label="Pantalla de bloqueo TikTok">
    <div class="icon" aria-hidden="true">🔒</div>
    <h1>Instagram Bloqueado</h1>

    <p class="phrase" id="phrase">frase 1</p>

    <div class="counter" id="counter">4</div>
  </div>

  <script>
    // Frases: cámbialas por las tuyas
    const frases = [
      "cada scroll es una excusa más",
      "el tiempo que pierdes no vuelve",
      "hoy también podrías haber avanzado",
      "estás eligiendo comodidad, no futuro",
      "cada scroll es una excusa más",
      "si sigues así, no te quejes luego",
      "esto no es descanso, es huida",
      "no eres distinto si haces lo mismo",
      "los resultados no llegan viendo esto",
      "deja de traicionarte",
      "el precio del éxito es aburrimiento diario",
      "estás eligiendo comodidad, no futuro",
      "sigues posponiendo la vida q dices querer",
      "esto no te acerca a nada",
      "nadie exitoso hace esto sin control",
      "sabes exactamente lo que deberías estar haciendo",
      "estás cómodo, y eso es peligroso"
    ];

    // Frase aleatoria en cada carga/recarga
    document.getElementById("phrase").textContent =
      frases[Math.floor(Math.random() * frases.length)];

    // Contador 4 → 0, color verde → rojo (HSL 120 → 0)
    const maxT = 4;
    let t = maxT;
    const counterEl = document.getElementById("counter");

    function render(n){
      counterEl.textContent = n;

      const ratio = maxT === 0 ? 0 : (n / maxT);     // 1 → 0
      const hue = Math.round(120 * ratio);           // 120 verde → 0 rojo
      counterEl.style.color = `hsl(${hue} 85% 60%)`;

      // mini “punch” visual al cambiar
      counterEl.style.transform = "scale(1.03)";
      setTimeout(() => counterEl.style.transform = "scale(1)", 90);
    }

    render(t);

    const timer = setInterval(() => {
      t -= 1;
      if (t < 0){
        clearInterval(timer);
        return;
      }
      render(t);
    }, 1000);
  </script>
</body>
</html>
